<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Pedidos - Fluir</title>
<style>
    :root {
        --cor-primaria: #047373;
        --cor-primaria-escura: #035c5c;
        --cor-sucesso: #28a745;
    }
    body {
        font-family: Arial, sans-serif;
        background: #f9fafc;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
    }
    th {
        background: #f4f4f4;
    }
    .btn {
        padding: 6px 10px;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
        color: white;
    }
    .btn-confirmar { background: var(--cor-sucesso); }
    .btn-enviar { background: var(--cor-primaria); }
</style>
</head>
<body>

<div class="container">
    <h1>Pedidos Pendentes</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Qtd</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for pedido in pedidos %}
            <tr>
                <td>{{ pedido.id }}</td>
                <td>{{ pedido.cliente }}</td>
                <td>{{ pedido.produto }}</td>
                <td>{{ pedido.quantidade }}</td>
                <td>{{ pedido.status }}</td>
                <td>
                    {% if pedido.status == 'Pendente' %}
                        <form method="POST" action="/pedidos/{{ pedido.id }}/confirmar" style="display:inline">
                            <button type="submit" class="btn btn-confirmar">Confirmar</button>
                        </form>
                    {% endif %}
                    {% if pedido.status == 'Confirmado' %}
                        <form method="POST" action="/pedidos/{{ pedido.id }}/enviar" style="display:inline">
                            <button type="submit" class="btn btn-enviar">Enviar</button>
                        </form>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
