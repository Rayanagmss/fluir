<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Formulário de Entrega</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/detalhe-entrega.css') }}">

</head>
<body>
  <section class="section">
    <div class="form-box">  
      <h2>Detalhes de Entrega</h2>
      <!-- Formulário envia via POST para /enviar_pedido -->
      <form action="/enviar_pedido" method="POST">
        <input type="text" name="cpf" placeholder="CPF" required />
        <input type="text" name="bairro" placeholder="Bairro" required />
        <input type="text" name="rua" placeholder="Rua" required />
        <input type="text" name="cidade" placeholder="Cidade" required />
        <input type="text" name="estado" placeholder="Estado" required />
        <input type="text" name="numero" placeholder="Número" required />
        <input type="text" name="complemento" placeholder="Complemento (opcional)" />
        <button type="submit">Enviar Solicitação</button>
      </form>

      <!-- Link para acompanhar pedido -->
      <br>
      <a href="/acompanhar">Acompanhar Pedido</a>
    </div>
    <div class="image-box">
      <!-- Imagem estática -->
      <img src="{{ url_for('static', filename='img/image.png') }}" alt="Imagem" />
    </div>
  </section>
</body>
</html>
